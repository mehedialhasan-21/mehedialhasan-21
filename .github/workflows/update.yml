name: Auto Update GitHub Profile README

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Advanced Profile Pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update.py

      - name: Commit and Push Changes Safely
        run: |
          git config --local user.email "programmer.mehedialhasansawon21@gmail.com"
          git config --local user.name "mehedialhasan-21"

          # Stage files safely
          git add README.md assets/stats.svg data_cache.json || true

          # Check git status
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(profile): auto-update metrics and SVG assets [skip ci]"
            git push origin HEAD:main || git push
          fi
